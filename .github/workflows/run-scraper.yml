name: Run Scripts and Email Outputs

on:
  schedule:
    - cron: '0 0 1 */3 *' # Esegue ogni 3 mesi (il primo giorno del mese a mezzanotte)
  workflow_dispatch: # Permette l'avvio manuale con un click da GitHub Actions

permissions:
  contents: write # IMPORTANTE: Consente a GitHub Actions di salvare lo storico aggiornato nel repository

jobs:
  run-and-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pandas openpyxl requests beautifulsoup4

      - name: Run Scraper
        run: python scrape_syllabus.py

      # Invia le email differenziate (onboarding nuovi iscritti con catalogo completo vs vecchi iscritti)
      - name: Send Notifications (New Courses & Onboarding)
        id: send_notifications
        run: python send_notifications.py
        env:
          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT: 465
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          EMAIL_BODY: ${{ secrets.EMAIL_BODY }}

      # Salva il database storico e il registro destinatari aggiornati nel repository se ci sono modifiche
      - name: Commit and push updated history
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/corsi_storico.json data/recipients_history.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: aggiornato storico corsi e registro destinatari [skip ci]"
            git push
          else
            echo "Nessuna modifica da salvare nel repository."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Carica i file su GitHub come backup (eseguito solo se sono state inviate email)
      - name: Upload Artifacts (Backup su GitHub)
        if: steps.send_notifications.outputs.emails_sent == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: output-files
          if-no-files-found: ignore
          path: |
            data/json/*.json
            data/excel/*.xlsx
